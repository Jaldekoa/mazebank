services:
  servidor-mazebank:
    image: postgres:latest
    container_name: servidor-mazebank
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - mazebank-network

  gestor-pgadmin:
    image: dpage/pgadmin4
    container_name: gestor-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - mazebank-network
    depends_on:
      - servidor-mazebank

networks:
  mazebank-network:
    driver: bridge

volumes:
  db-data:
